name: v0.1.8 motion sampling probe

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

env:
  MOTION_SOURCE_COMMIT: 62de0b718df9241d015a29d57a17ba22deb2ae51
  SDK_SOURCE_COMMIT: d30f88d8ee9c16238a78dd538b8254cc3cbcc713

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - name: Prepare native preferences and original source references
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apollo-motion-probe"
          if [ "$RUNNER_OS" = macOS ]; then
            defaults write -g AppleShowScrollBars -string WhenScrolling
            defaults write -g AppleLanguages -array zh-Hans-CN
            defaults write -g AppleLocale -string zh_CN
          fi
          git fetch --no-tags --depth=1 origin "$MOTION_SOURCE_COMMIT" "$SDK_SOURCE_COMMIT"
      - name: Download the original SDK archive without building
        uses: actions/download-artifact@v8
        with:
          name: v018-visual-frozen-d30f88d8ee9c16238a78dd538b8254cc3cbcc713
          run-id: '41376291926'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apollo-motion-frozen
      - name: Restore verified read-only SDK and fixture inputs
        id: restore
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/apollo-motion-frozen"
          shasum -a 256 -c apollo-visual-frozen.tar.gz.sha256
          tar -xzf apollo-visual-frozen.tar.gz -C "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 -c tests/visual/.artifacts/candidate-freeze/files.sha256 > "$RUNNER_TEMP/apollo-motion-probe/inputs-before.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';
          import { artifactDigest, assertFrozenSource } from './scripts/verification.mjs';
          const metadata = JSON.parse(fs.readFileSync('tests/visual/.artifacts/candidate-freeze/groups.json', 'utf8'));
          assert.equal(metadata.sourceCommit, process.env.SDK_SOURCE_COMMIT);
          assert.equal(artifactDigest(process.cwd()), metadata.sdkDigest);
          assertFrozenSource(process.cwd(), process.env.GITHUB_SHA);
          const changed = execFileSync('git', ['diff', '--name-only', process.env.MOTION_SOURCE_COMMIT, 'HEAD'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          const allowed = new Set(['.github/workflows/ci.yml', 'packages/docs/tests/motion-review-browser.mjs', 'tests/visual/stabilize.mjs', 'tests/tooling/chrome-launch.test.mjs', 'packages/docs/tests/motion-sampling.mjs', 'tests/tooling/motion-sampling.test.mjs']);
          assert.ok(changed.every(file => allowed.has(file)), `Unexpected probe source changes: ${changed.join(', ')}`);
          const cssInputs = execFileSync('git', ['diff', '--name-only', process.env.SDK_SOURCE_COMMIT, process.env.MOTION_SOURCE_COMMIT, '--', 'packages/ui/src', 'packages/motion/src', 'packages/theme/src', 'tests/compat/motion-review', ':(exclude)**/__tests__/**'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          assert.deepEqual(cssInputs, ['packages/theme/src/get-design-token.ts']);
          const origin = { targetedProbe: true, finalAcceptance: false, motionSourceCommit: process.env.MOTION_SOURCE_COMMIT, probeCommit: process.env.GITHUB_SHA, sdkRunId: '41376291926', sdkArtifactId: '13111302284', sdkSourceCommit: metadata.sourceCommit, sdkDigest: metadata.sdkDigest, sdkReuseBoundary: 'Original D30 dist/CSS. Current motion/UI source is 62de0b71; the sole production theme change repairs own __proto__ input, absent from default CSS inputs. This is not a rebuilt SDK acceptance.', changedProbeFiles: changed, changedProductionCssInputs: cssInputs };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/apollo-motion-probe/origin.json`, `${JSON.stringify(origin, null, 2)}\n`);
          NODE
          chmod -R a-w packages/*/dist tests/visual/.artifacts/vue tests/visual/.artifacts/candidate-freeze
      - name: Install approved Chrome for Testing 150
        id: canonical
        env:
          CHROME_VERSION: '150.0.7871.125'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            curl --fail --location "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/mac-x64/chrome-mac-x64.zip" --output "$RUNNER_TEMP/apollo-motion-chrome.zip"
            ditto -x -k "$RUNNER_TEMP/apollo-motion-chrome.zip" "$RUNNER_TEMP/apollo-motion-chrome"
            apollo_chrome_binary="$RUNNER_TEMP/apollo-motion-chrome/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          else
            curl --fail --location "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip" --output "$RUNNER_TEMP/apollo-motion-chrome.zip"
            unzip -q "$RUNNER_TEMP/apollo-motion-chrome.zip" -d "$RUNNER_TEMP/apollo-motion-chrome"
            apollo_chrome_binary="$RUNNER_TEMP/apollo-motion-chrome/chrome-linux64/chrome"
          fi
          "$apollo_chrome_binary" --version | grep -F "$CHROME_VERSION"
          printf 'executable=%s\n' "$apollo_chrome_binary" >> "$GITHUB_OUTPUT"
      - name: Verify launch arguments without changing default consumers
        run: node --test tests/tooling/chrome-launch.test.mjs tests/tooling/motion-sampling.test.mjs
      - name: Compare operating systems with identical current capture code and Chrome version
        env:
          APOLLO_CHROME_EXECUTABLE: ${{ steps.canonical.outputs.executable }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          const directory = `${process.env.RUNNER_TEMP}/apollo-motion-probe`;
          const runner = 'packages/docs/tests/motion-review-browser.mjs';
          const evidence = 'docs/audit/evidence/review-002-motion.json';
          const candidate = fs.readFileSync(runner);
          const originalEvidence = fs.readFileSync(evidence);
          const hash = data => createHash('sha256').update(data).digest('hex');
          const host = () => ({ generatedAt: new Date().toISOString(), platform: process.platform, arch: process.arch, osRelease: os.release(), osVersion: process.platform === 'darwin' ? execFileSync('sw_vers', ['-productVersion'], { encoding: 'utf8' }).trim() : os.release(), osBuild: process.platform === 'darwin' ? execFileSync('sw_vers', ['-buildVersion'], { encoding: 'utf8' }).trim() : null, cpuModels: [...new Set(os.cpus().map(cpu => cpu.model))], logicalCpuCount: os.cpus().length, totalMemory: os.totalmem(), freeMemory: os.freemem(), loadAverage: os.loadavg(), nodeVersion: process.version, nodeExecutable: process.execPath });
          const metadata = { before: host(), canonicalExecutable: process.env.APOLLO_CHROME_EXECUTABLE, canonicalVersion: execFileSync(process.env.APOLLO_CHROME_EXECUTABLE, ['--version'], { encoding: 'utf8' }).trim(), runs: [] };
          fs.writeFileSync(`${directory}/host.json`, `${JSON.stringify(metadata, null, 2)}\n`);
          const plans = [{ name: `native-${process.platform}-cft150`, source: candidate, canonical: true, timer: false, expectedMajor: '150.0.7871.125' }];
          try {
            for (const plan of plans) {
              fs.writeFileSync(runner, plan.source);
              fs.rmSync(evidence, { force: true });
              const env = { ...process.env, DEBUG: 'pw:browser', DEBUG_COLORS: '0' };
              if (!plan.canonical) delete env.APOLLO_CHROME_EXECUTABLE;
              const stdoutFile = `${directory}/${plan.name}.stdout.log`;
              const stderrFile = `${directory}/${plan.name}.stderr.log`;
              const stdout = fs.openSync(stdoutFile, 'w'), stderr = fs.openSync(stderrFile, 'w');
              const before = host(), started = performance.now();
              console.log(`Starting ${plan.name}; the other browser still runs if this one fails.`);
              let result;
              try { result = spawnSync(process.execPath, [runner], { env, stdio: ['ignore', stdout, stderr] }); }
              finally { fs.closeSync(stdout); fs.closeSync(stderr); }
              const record = { name: plan.name, runnerSha256: hash(plan.source), exitCode: result.status, signal: result.signal, processError: result.error?.message, durationMs: Math.round(performance.now() - started), hostBefore: before, hostAfter: host(), stdoutFile, stderrFile, reportGenerated: fs.existsSync(evidence) };
              const stderrText = fs.readFileSync(stderrFile, 'utf8');
              record.actualExecutablePath = /<launching>\s+(.+?)\s+--/.exec(stderrText)?.[1];
              process.stdout.write(fs.readFileSync(stdoutFile));
              process.stderr.write(stderrText);
              if (record.reportGenerated) {
                fs.copyFileSync(evidence, `${directory}/${plan.name}.json`);
                try {
                  const report = JSON.parse(fs.readFileSync(evidence, 'utf8'));
                  record.browserVersion = report.browserVersion;
                  record.browserArguments = report.browserArguments;
                  record.checkCount = report.checks.length;
                  record.checkNames = report.checks.map(check => check.name);
                  record.failures = report.checks.filter(check => !check.ok);
                } catch (error) { record.reportReadError = error.message; }
              }
              record.passed = result.status === 0 && result.signal === null && record.checkCount === 60 && record.failures?.length === 0 && record.browserVersion?.startsWith(plan.expectedMajor) && Boolean(record.actualExecutablePath) && (!plan.canonical || record.actualExecutablePath === process.env.APOLLO_CHROME_EXECUTABLE);
              record.timerFeaturePresent = record.browserArguments?.some(argument => argument.includes('ForceMacVSyncTimerForDebugging')) ?? false;
              record.passed &&= record.timerFeaturePresent === plan.timer;
              metadata.runs.push(record);
              fs.writeFileSync(runner, candidate);
              fs.writeFileSync(evidence, originalEvidence);
              fs.writeFileSync(`${directory}/comparison.json`, `${JSON.stringify(metadata, null, 2)}\n`);
            }
          } finally {
            fs.writeFileSync(runner, candidate);
            fs.writeFileSync(evidence, originalEvidence);
          }
          assert.equal(metadata.runs.length, 1);
          for (const record of metadata.runs) {
            assert.equal(record.checkCount, 60, `${record.name} must finish all checks`);
            assert.equal(record.signal, null, `${record.name} must exit normally`);
            assert.equal(record.actualExecutablePath, process.env.APOLLO_CHROME_EXECUTABLE);
            assert.equal(record.browserVersion, '150.0.7871.125');
          }
          assert.ok(metadata.runs[0].passed, JSON.stringify(metadata.runs.map(({ name, passed, exitCode, signal, browserVersion, actualExecutablePath, checkCount, failures }) => ({ name, passed, exitCode, signal, browserVersion, actualExecutablePath, checkCount, failures })), null, 2));
          NODE
      - name: Verify SDK and source after both runs, including a failed comparison
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: |
          set -euo pipefail
          shasum -a 256 -c tests/visual/.artifacts/candidate-freeze/files.sha256 > "$RUNNER_TEMP/apollo-motion-probe/inputs-after.log"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { artifactDigest, assertFrozenSource } from './scripts/verification.mjs';
          const origin = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/apollo-motion-probe/origin.json`, 'utf8'));
          assert.equal(artifactDigest(process.cwd()), origin.sdkDigest);
          assertFrozenSource(process.cwd(), process.env.GITHUB_SHA);
          NODE
      - name: Upload both raw JSON reports, console and host evidence
        id: upload_primary
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: v018-motion-probe-${{ github.sha }}-${{ matrix.runner }}
          path: ${{ runner.temp }}/apollo-motion-probe/
          if-no-files-found: error
          retention-days: 14
      - name: Record the original upload failure before the sole recovery
        if: ${{ always() && steps.upload_primary.outcome == 'failure' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apollo-motion-probe"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/apollo-motion-probe/upload-original-failure.json`, `${JSON.stringify({ originalUploadOutcome: 'failure', recoveryAttempt: 1, originalRunLog: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`, note: 'Original upload error remains in its workflow step. This is the only recovery; a second failure fails the job.' }, null, 2)}\n`);
          NODE
      - name: Recover upload once under a separate artifact name
        if: ${{ always() && steps.upload_primary.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: v018-motion-probe-${{ github.sha }}-${{ matrix.runner }}-upload-retry-1
          path: ${{ runner.temp }}/apollo-motion-probe/
          if-no-files-found: error
          retention-days: 14
