# Stage one is scoped PR feedback. Stage two is an explicit frozen-version acceptance.
name: CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '.workbuddy/**'
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stage:
        description: Verification stage
        type: choice
        options: [architecture, acceptance]
        default: architecture
      reference_visual:
        description: Also run optional upstream visual diagnostics after final acceptance
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

jobs:
  architecture:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.stage != 'acceptance') }}
    name: Architecture feedback for changed scopes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: State, metadata and generated progress consistency
        run: pnpm run registry:check
      - name: Scoped behavior, types and necessary Docs checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node scripts/verify-changed.mjs --base "$BASE_SHA" --report /tmp/architecture-checks.json
          else
            node scripts/verify-changed.mjs --base HEAD^ --report /tmp/architecture-checks.json
          fi
      - name: Keep focused results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-checks
          path: /tmp/architecture-checks.json
          if-no-files-found: warn
          retention-days: 7

  acceptance:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.stage == 'acceptance') }}
    name: Complete nine-dimension acceptance on one frozen commit
    # Pixel captures use the canonical macOS/browser/native font environment
    # checked by tests/visual/environment.mjs; historical PNG origins stay intact.
    runs-on: macos-15-intel
    # The complete native visual matrix follows ~44 minutes of build/runtime work.
    # The first tag run hit 120 minutes mid-matrix; case limits remain test-owned.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reuse completed acceptance for the exact version-tag commit
        if: github.ref_type == 'tag'
        id: prior_acceptance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reuse-tag-acceptance.mjs
      - uses: ./.github/actions/setup
        if: steps.prior_acceptance.outputs.reused != 'true'
      - name: Match the canonical native font and scrollbar settings
        if: steps.prior_acceptance.outputs.reused != 'true'
        run: |
          defaults write -g AppleShowScrollBars -string WhenScrolling
          defaults write -g AppleLanguages -array zh-Hans-CN
          defaults write -g AppleLocale -string zh_CN
      - name: Install visual browser
        if: steps.prior_acceptance.outputs.reused != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the exact approved visual Chrome
        if: steps.prior_acceptance.outputs.reused != 'true'
        id: visual_chrome
        env:
          APOLLO_BASELINE_CHROME_VERSION: '150.0.7871.125'
        run: |
          set -eu
          curl --fail --location "https://storage.googleapis.com/chrome-for-testing-public/$APOLLO_BASELINE_CHROME_VERSION/mac-x64/chrome-mac-x64.zip" --output "$RUNNER_TEMP/apollo-visual-chrome.zip"
          ditto -x -k "$RUNNER_TEMP/apollo-visual-chrome.zip" "$RUNNER_TEMP/apollo-visual-chrome"
          apollo_chrome_binary="$RUNNER_TEMP/apollo-visual-chrome/chrome-mac-x64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$apollo_chrome_binary" --version | grep -F "$APOLLO_BASELINE_CHROME_VERSION"
          printf 'executable=%s\n' "$apollo_chrome_binary" >> "$GITHUB_OUTPUT"
      - name: One build, coverage/runtime once, immutable consumers and full native visuals
        if: steps.prior_acceptance.outputs.reused != 'true'
        env:
          TMPDIR: ${{ runner.temp }}
          APOLLO_CHROME_EXECUTABLE: ${{ steps.visual_chrome.outputs.executable }}
        run: node scripts/verify-full.mjs --report /tmp/final-acceptance.json
      - name: Package the same artifacts for optional reference diagnostics
        if: ${{ inputs.reference_visual }}
        run: tar czf build-dist.tar.gz packages/*/dist tests/visual/.artifacts/vue
      - name: Keep build artifacts
        if: ${{ inputs.reference_visual }}
        uses: actions/upload-artifact@v7
        with:
          name: build-dist
          path: build-dist.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Keep final results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-acceptance
          path: |
            /tmp/final-acceptance.json
            /tmp/acceptance-reference.json
            coverage/
            tests/visual/report-apollo.json
            tests/visual/diff/apollo/
            ${{ runner.temp }}/apollo-docs-browser-*/docs/audit/evidence/
            ${{ runner.temp }}/apollo-overlay-z-index-*/result.json
            ${{ runner.temp }}/apollo-overlay-z-index-*/*.png
          if-no-files-found: warn
          retention-days: 14

  reference:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.reference_visual && inputs.stage == 'acceptance' }}
    needs: acceptance
    continue-on-error: true
    name: Optional historical upstream comparison
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: build-dist
      - run: tar xzf build-dist.tar.gz
      - run: pnpm exec playwright install --with-deps chromium
      - name: Check historical reference integrity
        run: pnpm run test:visual:reference:check
      - name: Compare against the same published artifacts
        continue-on-error: true
        run: node tests/visual/run.mjs --no-build --mode compare --shard ${{ matrix.shard }}/4
      - name: Reject incomplete rendering
        if: always()
        run: node tests/visual/assert-shard.mjs ${{ matrix.shard }}/4
      - name: Keep reference diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-${{ matrix.shard }}
          path: |
            tests/visual/report-*.json
            tests/visual/report-*.html
            tests/visual/diff/
            tests/visual/snapshots/
          if-no-files-found: error
          retention-days: 14
