# 文档站 → GitHub Pages（项目首页 https://apollocmh.github.io/apollo-design-ui/）
#
# 与 ci.yml 的分工：ci.yml 是代码门禁（registry/lint/test/build），本 workflow 只管
# 文档站的构建与发布。两者可并行，互不阻塞。
#
# 发布方式（2026-10-23 架构简化）：GitHub 官方 Actions Pages ——
#   configure-pages → upload-pages-artifact → deploy-pages。
#   Pages source = GitHub Actions；构建产物只作为 workflow artifact 流转，
#   **不再提交到任何 Git 分支**（`gh-pages` 分支已废弃）。
#
# 产物链路（与本地 `pnpm build:docs` 完全一致）：
#   theme 构建 → ui 构建（tokens.css + 组件 CSS 的真源）→ docs 构建
#   （内容管线 .generated → vite-ssg 预渲染，base=/apollo-design-ui/）
#
# ⚠️ vite-ssg 会做 SSR 预渲染；demo 一律**只在客户端**加载（DemoRenderer 在 onMounted
#     才 import 模块），因此组件里的浏览器 API 不会污染构建 —— 这是硬约束，别破坏。
#     产物里的 404.html / sitemap.xml / robots.txt 由 vite.config.ts 的 onFinished 生成。
name: Deploy Docs

on:
  # 版本发布：只有打版本标签才构建并发布（2026-10-21 用户裁决）。
  # 普通 master 提交不再触发；标签必须打在 master 上（发布流程约定）。
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Pages 部署串行化：同一时刻只允许一次发布；不取消进行中的部署，
# 避免取消已经提交给 Pages 的部署（官方模板同样用 cancel-in-progress: false）。
concurrency:
  group: pages
  cancel-in-progress: false

# 官方 Pages 部署所需权限：
#   contents: read —— 检出源码；
#   pages: write   —— 创建 Pages 部署；
#   id-token: write —— deploy-pages 通过 OIDC 验证部署来源。
# 构建产物不再推送到 Git，因此不需要 contents: write。
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: 构建文档站
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # 更新日志读取最近600条提交；默认浅克隆只会显示发布提交。
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # One build generates content and SSG; types/tests reuse those outputs.
      - name: Docs checks and one dependency-ordered build
        run: node scripts/verify-docs.mjs --build

      - name: 关键产物检查
        run: |
          set -eu
          D=packages/docs/dist
          test -f "$D/index.html" || { echo '缺少 index.html'; exit 1; }
          test -f "$D/404.html" || { echo '缺少 404.html（GitHub Pages 深链接兜底）'; exit 1; }
          test -f "$D/sitemap.xml" || { echo '缺少 sitemap.xml'; exit 1; }
          test -f "$D/robots.txt" || { echo '缺少 robots.txt'; exit 1; }
          grep -q 'apollo-design-ui' "$D/index.html" || { echo 'base 路径缺失'; exit 1; }
          echo "页面数: $(find "$D" -name '*.html' | wc -l)"
          # 深链接直访：组件页必须产出物理文件，且含真实正文（SSR 预渲染证据）
          test -f "$D/components/button.html" || { echo '组件页未预渲染'; exit 1; }
          grep -q 'id="何时使用"' "$D/components/button.html" || { echo '组件页正文为空'; exit 1; }
          test -f "$D/components/icon.html" || { echo '图标资源页未预渲染'; exit 1; }
          grep -q 'icon-catalog' "$D/components/icon.html" || { echo '图标资源页正文为空'; exit 1; }

      # 读取仓库 Pages 配置（base_url / base_path 等）；Pages 未启用时直接失败，
      # 避免把问题拖到 deploy 作业。
      - name: 配置 Pages
        uses: actions/configure-pages@v6

      # 产物只作为 workflow artifact 上传给 deploy-pages，不写入 Git。
      # 默认排除隐藏文件（如 `.vite` 缓存）；Actions 发布不跑 Jekyll，无需 `.nojekyll`。
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/docs/dist

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # github-pages Environment 的部署分支策略必须允许触发 ref
    # （master + `v*` 标签），否则 deploy-pages 会被环境策略拒绝。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
