# 文档站 → GitHub Pages（项目首页 https://apollocmh.github.io/apollo-design-ui/）
#
# 与 ci.yml 的分工：ci.yml 是代码门禁（registry/lint/test/build），本 workflow 只管
# 文档站的构建与发布。两者可并行，互不阻塞。
#
# 产物链路（与本地 `pnpm build:docs` 完全一致）：
#   theme 构建 → ui 构建（tokens.css + 组件 CSS 的真源）→ docs 构建
#   （内容管线 .generated → vite-ssg 预渲染，base=/apollo-design-ui/）
#
# ⚠️ vite-ssg 会做 SSR 预渲染；demo 一律**只在客户端**加载（DemoRenderer 在 onMounted
#     才 import 模块），因此组件里的浏览器 API 不会污染构建 —— 这是硬约束，别破坏。
#     产物里的 404.html / sitemap.xml / robots.txt 由 vite.config.ts 的 onFinished 生成。
name: Deploy Docs

on:
  # 版本发布：只有打版本标签才构建并发布（2026-10-21 用户裁决）。
  # 普通 master 提交不再触发；标签必须打在 master 上（发布流程约定）。
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Pages 部署需要并发保护：同 ref 只保留最新一次部署。
concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

# Pages 当前是 legacy「Deploy from a branch」模式，发布源 = `gh-pages`。
# `actions/deploy-pages` 要求 Pages source = GitHub Actions，且环境保护规则
# 只允许 `gh-pages` 分支（2026-10-21 实测：构建成功、部署被环境策略拒绝）。
# ⇒ 这里改为构建产物后**推送 gh-pages 分支**，与仓库既有手工发布流程一致。
permissions:
  contents: write

jobs:
  build:
    name: 构建文档站
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # 发布前先跑文档站自己的门禁（2026-10-21 审计 A04）。
      - name: 内容管线校验
        run: pnpm --filter @apollo-design/docs run content:check
      # `content:check` 只校验、不落盘，而 `src/composables/manifest.ts` 与多个测试
      # 直接 import `.generated/*.json` ⇒ 类型检查前必须先生成产物，否则干净 checkout
      # 上必报 TS2307（2026-10-21 首次 Deploy Docs 实测）。
      - name: 生成内容管线产物
        run: pnpm --filter @apollo-design/docs run content:build
      - name: 文档站类型检查
        run: pnpm --filter @apollo-design/docs run typecheck
      - name: 文档站单元测试
        run: pnpm --filter @apollo-design/docs run test

      # 干净 checkout 上没有 foundation dist；必须按拓扑序构建全部包
      # （utils → theme/icons → … → ui → docs）。L7 门禁的 B1 就是包的
      # 真实 `scripts.build`，同时校验产物契约；文档站 dist 也由这一步产出。
      - name: 构建全部包（拓扑序 + L7 产物检查）
        run: pnpm run test:build

      - name: 关键产物检查
        run: |
          set -eu
          D=packages/docs/dist
          test -f "$D/index.html" || { echo '缺少 index.html'; exit 1; }
          test -f "$D/404.html" || { echo '缺少 404.html（GitHub Pages 深链接兜底）'; exit 1; }
          test -f "$D/sitemap.xml" || { echo '缺少 sitemap.xml'; exit 1; }
          test -f "$D/robots.txt" || { echo '缺少 robots.txt'; exit 1; }
          grep -q 'apollo-design-ui' "$D/index.html" || { echo 'base 路径缺失'; exit 1; }
          echo "页面数: $(find "$D" -name '*.html' | wc -l)"
          # 深链接直访：组件页必须产出物理文件，且含真实正文（SSR 预渲染证据）
          test -f "$D/components/button.html" || { echo '组件页未预渲染'; exit 1; }
          grep -q 'id="何时使用"' "$D/components/button.html" || { echo '组件页正文为空'; exit 1; }
          test -f "$D/components/icon.html" || { echo '图标资源页未预渲染'; exit 1; }
          grep -q 'icon-catalog' "$D/components/icon.html" || { echo '图标资源页正文为空'; exit 1; }

      - name: 上传文档站 dist（供 deploy 作业）
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: packages/docs/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: 发布到 gh-pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: /tmp/docs-dist

      - name: 同步 dist 到 gh-pages 并推送
        shell: bash
        run: |
          set -eu
          # 保留 .git 与 .nojekyll，其余全部替换为本次 SSG 产物
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .nojekyll -exec rm -rf {} +
          cp -a /tmp/docs-dist/. .
          test -f .nojekyll || touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages 无变化，跳过提交"
            exit 0
          fi
          git commit -m "docs: deploy ${GITHUB_REF_NAME}"
          git push origin HEAD:gh-pages
