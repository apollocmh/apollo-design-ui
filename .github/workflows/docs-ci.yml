# Explicit complete Docs SSG/browser gate. Scoped PR checks live in the main CI.
name: Docs CI

# PR Docs feedback runs in the main changed-scope job; this explicit workflow retains
# the complete SSG and browser suite without building the same packages twice.
on:
  workflow_dispatch:

concurrency:
  group: docs-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: 文档站（内容 / 类型 / 单测 / SSG）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Docs checks and one dependency-ordered build including SSG
        run: node scripts/verify-docs.mjs --build

      - name: 关键产物检查（深链接 / base）
        shell: bash
        run: |
          set -eu
          D=packages/docs/dist
          test -f "$D/index.html"
          test -f "$D/404.html"
          test -f "$D/components/button.html"
          test -f "$D/components/icon.html"
          grep -q 'apollo-design-ui' "$D/index.html"
          echo "页面数: $(find "$D" -name '*.html' | wc -l)"

      # L8：浏览器冒烟由 `packages/docs/tests/smoke-browser.mjs` 承担，
      # 覆盖 SSR / 水合 / demo 真实渲染 / 语言 / 主题 / 搜索 / 图标目录 / 移动端抽屉。
      - name: 安装 Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Existing browser checks on the same built site
        run: node scripts/verify-docs-browser.mjs
