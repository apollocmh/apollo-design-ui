# Runtime dependency versions and optional reference-tool versions are independent.
# React/antd/rc packages below are used by existing dev-only reference harnesses.
# Keep them until their consumers have an independently validated replacement.
packages:
  - 'packages/*'

allowBuilds:
  esbuild: true

catalog:
  vue: ^3.5.42

  dayjs: ^1.11.23
  'scroll-into-view-if-needed': ^3.1.0

  '@ant-design/icons-svg': ^4.6.0
  '@ant-design/colors': ^8.0.1
  '@ant-design/fast-color': ^3.0.1

  '@rc-component/async-validator': ^6.0.0

  '@rc-component/form': ^1.8.6

  '@rc-component/picker': 1.12.2

  '@vueuse/core': ^14.4.0

  typescript: ^5.9.2
  '@types/node': ^22.19.0
  vite: ^8.3.0
  '@vitejs/plugin-vue': ^6.0.9
  unbuild: ^3.6.1
  vue-tsc: ^3.3.11

  vitest: ^5.0.1
  '@vitest/browser': ^5.0.1
  '@vitest/coverage-v8': ^5.0.1
  '@vue/test-utils': ^2.5.0
  '@testing-library/jest-dom': ^6.9.1
  jsdom: ^30.0.1
  axe-core: ^4.13.0
  playwright: 1.58.0
  '@axe-core/playwright': ^4.13.0

  pixelmatch: ^7.2.0
  pngjs: ^7.0.0
  sharp: ^0.35.4

  react: ^19.3.0
  react-dom: ^19.3.0
  antd: 6.6.4
  '@testing-library/react': ^16.3.3
  '@ant-design/icons': ^6.3.4

  publint: ^0.3.24
  '@biomejs/biome': ^2.0.0

minimumReleaseAgeExclude:
  - '@vitest/browser@5.0.1'
  - '@vitest/coverage-v8@5.0.1'
  - '@vitest/mocker@5.0.1'
  - '@vitest/pretty-format@5.0.1'
  - '@vitest/spy@5.0.1'
  - '@vitest/ui@5.0.1'
  - '@vitest/utils@5.0.1'
  - vitest@5.0.1
